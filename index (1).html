<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>아준 역무원 - 한글 승차권 복구센터</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <header class="top-bar">
    <div>
      <div class="mini-title">KOREAN WRITING TRAIN</div>
      <h1>🚆 아준 역무원</h1>
    </div>

    <div class="score-box">
      ⭐ <span id="score">0</span>
    </div>
  </header>


  <!-- 난이도 -->
  <section class="level-panel">

    <div class="level-title">
      오늘의 임무 난이도
    </div>

    <div class="level-buttons">
      <button data-level="1" class="level-btn active">
        1<br><span>자음</span>
      </button>

      <button data-level="2" class="level-btn">
        2<br><span>모음</span>
      </button>

      <button data-level="3" class="level-btn">
        3<br><span>섞어서</span>
      </button>

      <button data-level="4" class="level-btn">
        4<br><span>한 글자</span>
      </button>

      <button data-level="5" class="level-btn">
        5<br><span>단어</span>
      </button>
    </div>

    <div id="levelText" class="level-description">
      LEVEL 1 · 자음 하나 쓰기
    </div>

  </section>


  <!-- 역 -->
  <section class="station">

    <div class="station-sign">
      🚉 창원중앙역
    </div>

    <div class="rail">
      <div id="train" class="train">
        🚄
      </div>
    </div>

  </section>


  <!-- 승차권 -->
  <section class="ticket">

    <div class="ticket-top">
      <div>
        <span class="ticket-label">KTX 승차권</span>
        <strong>글자 복구 임무</strong>
      </div>

      <div id="wordEmoji" class="word-emoji">
        🚆
      </div>
    </div>


    <div class="route">

      <div>
        <small>출발</small>
        <strong>창원중앙</strong>
      </div>

      <div class="route-arrow">
        ➜
      </div>

      <div>
        <small>목적지</small>
        <strong id="destination">서울</strong>
      </div>

    </div>


    <div class="mission-box">

      <div id="missionText" class="mission">
        승차권에서 글자가 지워졌어요!
      </div>

      <div id="wordDisplay" class="word-display">
        기 □
      </div>

    </div>

  </section>


  <!-- 쓰기 영역 -->
  <section class="writing-section">

    <div class="writing-title">
      ✏️ 아준 역무원, 여기에 직접 써 주세요!
    </div>

    <div class="canvas-wrap">
      <canvas id="writingCanvas"></canvas>

      <div class="canvas-guide">
        직접 써보기
      </div>
    </div>


    <div class="action-buttons">

      <button id="clearBtn" class="action secondary">
        🧽 지우기
      </button>

      <button id="hintBtn" class="action hint">
        💡 힌트
      </button>

      <button id="checkBtn" class="action primary">
        ✅ 다 썼어요!
      </button>

    </div>

  </section>


  <footer>
    🚦 승차권을 고치면 기차가 출발해요!
  </footer>

</div>


<script src="script.js"></script>

</body>
</html>
